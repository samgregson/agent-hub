groups:
  - name: agent-hub-api
    rules:
      - alert: AgentHubApiUnavailable
        expr: up{job="agent-hub-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Agent Hub API replica is unavailable
          description: The private API scrape target has been unavailable for two minutes.
      - alert: AgentHubApiHighErrorRate
        expr: |
          (
            sum(rate(agent_hub_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(agent_hub_http_requests_total[5m])), 0.001)
          ) > 0.05
          and sum(increase(agent_hub_http_requests_total[5m])) > 20
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Agent Hub API has a sustained 5xx error rate
      - alert: AgentHubApiHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(agent_hub_http_request_duration_seconds_bucket[5m]))
          ) > 5
          and sum(increase(agent_hub_http_requests_total[5m])) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Agent Hub API p95 latency exceeds five seconds
      - alert: AgentHubPluginBusy
        expr: sum(increase(agent_hub_http_requests_total{status="429"}[10m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent Hub is repeatedly rejecting busy Plugin operations
