<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Cantilever moment</title>
    <style>
      :root { background: #102019; color: #e9eee8; font: 14px system-ui; }
      body { margin: 0; padding: 18px; }
      .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
      .card { padding: 16px; border: 1px solid #315441; border-radius: 12px; background: #14281f; }
      svg { width: 100%; }
      .beam { stroke: #eef5ea; stroke-width: 7; }
      .load { stroke: #ff8d80; stroke-width: 4; }
      .support { stroke: #8fb69a; stroke-width: 5; }
      .curve { fill: none; stroke: #f2bf6a; stroke-width: 4; }
      label { display: grid; gap: 5px; margin: 9px 0; }
      input { padding: 8px; background: #0d1912; color: inherit; border: 1px solid #4c7156; border-radius: 7px; }
      strong { font-size: 28px; color: #d8ff9b; }
      small { color: #b8c8b7; }
    </style>
  </head>
  <body>
    <main>
      <small>REFERENCE CALCULATION</small>
      <h1>Cantilever moment</h1>
      <div class="grid">
        <section class="card">
          <svg viewBox="0 0 430 230" role="img" aria-label="Cantilever beam with tip load and bending moment">
            <path class="support" d="M55 38v112m-25-105 25-18m-25 36 25-18m-25 36 25-18m-25 36 25-18"/>
            <line class="beam" x1="58" y1="125" x2="365" y2="125"/>
            <path class="load" d="M365 48v55m-10-12 10 12 10-12"/>
            <path id="moment-curve" class="curve" d="M58 185 Q210 185 365 150"/>
          </svg>
          <small>Mmax = P × L</small>
        </section>
        <section class="card">
          <label>Span L (m)<input id="length" type="number" value="4"></label>
          <label>Tip load P (kN)<input id="load" type="number" value="12.5"></label>
          <small>Maximum bending moment</small>
          <strong id="result">50.0 kN·m</strong>
          <p id="validation"><small>Valid reference calculation — no design-code checks.</small></p>
        </section>
      </div>
    </main>
    <script>
      const length = document.querySelector("#length");
      const load = document.querySelector("#load");
      const result = document.querySelector("#result");
      const validation = document.querySelector("#validation");
      const curve = document.querySelector("#moment-curve");

      function draw() {
        const span = +length.value;
        const tipLoad = +load.value;
        const moment = span * tipLoad;
        const valid = span > 0 && tipLoad > 0;
        result.textContent = valid ? `${moment.toFixed(1)} kN·m` : "—";
        validation.innerHTML = `<small>${valid ? "Valid reference calculation — no design-code checks." : "Enter positive span and load values."}</small>`;
        curve.setAttribute("d", `M58 185 Q210 185 365 ${valid ? Math.max(142, 185 - moment) : 185}`);
      }

      function initialize(request) {
        window.parent.postMessage({
          jsonrpc: "2.0",
          id: request.id,
          result: {
            protocolVersion: "2026-01-26",
            hostCapabilities: {},
            hostContext: {},
            hostInfo: { name: "Reference calculation", version: "0.1.0" },
          },
        }, "*");
        window.parent.postMessage({
          jsonrpc: "2.0",
          method: "ui/notifications/initialized",
          params: {},
        }, "*");
      }

      window.addEventListener("message", (event) => {
        const message = event.data;
        if (message?.method === "ui/initialize") initialize(message);
        const snapshot = message?.method === "ui/notifications/tool-result"
          ? message.params?.structuredContent?.payload
          : null;
        const input = snapshot?.input;
        const calculation = snapshot?.output?.calculation;
        if (typeof input?.length_m === "number" && typeof input?.tip_load_kn === "number") {
          length.value = input.length_m;
          load.value = input.tip_load_kn;
          draw();
        }
        if (typeof calculation?.maximumMoment?.value === "number") {
          result.textContent = `${calculation.maximumMoment.value.toFixed(1)} ${calculation.maximumMoment.unit || "kN·m"}`;
        }
      });

      length.oninput = load.oninput = draw;
      window.parent.postMessage({
        jsonrpc: "2.0",
        id: "reference-calculation-initialize",
        method: "ui/initialize",
        params: {
          appInfo: { name: "Reference calculation", version: "0.1.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26",
        },
      }, "*");
    </script>
  </body>
</html>
