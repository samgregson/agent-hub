<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cantilever moment</title><style>
:root{color:#e9eee8;background:#102019;font:14px system-ui,sans-serif}body{margin:0;padding:18px}main{max-width:680px;margin:auto}.eyebrow{color:#9fdc91;text-transform:uppercase;letter-spacing:.12em;font-size:11px}h1{margin:.3rem 0 1rem;font-size:24px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{padding:16px;border:1px solid #315441;border-radius:12px;background:#14281f}svg{width:100%;height:auto}label{display:grid;gap:5px;margin:9px 0;color:#bdd0bf}input{padding:8px;border:1px solid #4c7156;border-radius:7px;background:#0d1912;color:inherit}strong{font-size:28px;color:#d8ff9b}small{color:#aebdaf}.curve{fill:none;stroke:#f2bf6a;stroke-width:4}.beam{stroke:#eef5ea;stroke-width:7}.load{stroke:#ff8d80;stroke-width:4}.support{stroke:#8fb69a;stroke-width:5}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="eyebrow">Reference calculation</div><h1>Cantilever moment</h1><div class="grid"><section class="card"><svg viewBox="0 0 430 230" role="img" aria-label="Cantilever beam with a downward tip load and bending moment diagram"><path class="support" d="M55 38v112m-25-105 25-18m-25 36 25-18m-25 36 25-18m-25 36 25-18"/><line class="beam" x1="58" y1="125" x2="365" y2="125"/><path class="load" d="M365 48v55m-10-12 10 12 10-12"/><text x="342" y="40" fill="#ffb1a7">P</text><path id="moment-curve" class="curve" d="M58 185 Q210 185 365 150"/><text x="58" y="215" fill="#f2bf6a">Mmax</text></svg><small>Fixed-end moment: M<sub>max</sub> = P × L</small></section><section class="card"><label>Span L (m)<input id="length" type="number" min="0" step="0.1" value="4"></label><label>Tip load P (kN)<input id="load" type="number" min="0" step="0.1" value="12.5"></label><small>Maximum bending moment</small><strong id="result">50.0 kN·m</strong><p id="validation"><small>Valid reference calculation — no design-code checks.</small></p></section></div></main><script>const l=document.querySelector('#length'),p=document.querySelector('#load'),r=document.querySelector('#result'),v=document.querySelector('#validation'),c=document.querySelector('#moment-curve');function update(){const L=+l.value,P=+p.value,M=L*P,ok=L>0&&P>0;r.textContent=ok?`${M.toFixed(1)} kN·m`:'—';v.innerHTML=`<small>${ok?'Valid reference calculation — no design-code checks.':'Enter positive span and load values.'}</small>`;c.setAttribute('d',`M58 185 Q210 185 365 ${ok?Math.max(142,185-M):185}`)}l.oninput=p.oninput=update;</script></body></html>
