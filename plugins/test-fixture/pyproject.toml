[project]
name = "agent-hub-foundation-fixture"
version = "0.1.0"
description = "A portable FastMCP fixture for Agent Hub's Plugin Gateway"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp[apps]==4.0.4",
]

[project.scripts]
agent-hub-foundation-fixture = "agent_hub_foundation_fixture._server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub_foundation_fixture"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"
