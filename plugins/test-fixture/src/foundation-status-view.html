<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hub foundation status</title>
    <style>
      :root {
        color: #f4f2ec;
        background: #181816;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 1rem;
      }

      main {
        display: grid;
        gap: 0.4rem;
        padding: 1rem;
        border: 1px solid #3b3933;
        border-radius: 0.75rem;
        background: #22221e;
      }

      p {
        margin: 0;
        color: #aaa69d;
      }

      strong {
        color: #e9ff70;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>Foundation fixture available</strong>
      <p>
        This portable MCP App is a read-only status view. It has no Agent Hub
        storage, credentials, or host-only inputs.
      </p>
    </main>
  </body>
</html>
