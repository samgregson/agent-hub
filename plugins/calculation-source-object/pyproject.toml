[project]
name = "agent-hub-calculation-source-object"
version = "0.1.0"
description = "A CalculationSourceObject MCP Plugin for Agent Hub"
requires-python = ">=3.12,<3.15"
dependencies = ["fastmcp==4.0.4"]

[dependency-groups]
dev = ["ruff==0.16.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub_calculation_source_object"]

[tool.ruff]
line-length = 100
target-version = "py312"
