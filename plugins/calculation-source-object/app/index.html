<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculation report</title>
    <style>
      :root { color-scheme: light; font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; color: #1e2925; background: #f5f7f3; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; }
      #root { max-width: 1000px; margin: 0 auto; }
      .page-header { border-bottom: 1px solid #d9e1d9; padding-bottom: 16px; margin-bottom: 20px; }
      .eyebrow { margin: 0 0 6px; color: #596d60; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); letter-spacing: -.03em; }
      .meta { margin-top: 8px; color: #58645d; font-size: 12px; overflow-wrap: anywhere; }
      .notice { padding: 12px 14px; margin: 16px 0; border: 1px solid #dfd2a9; border-radius: 10px; color: #5c4d20; background: #fff9e8; }
      .inputs { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
      .input { display: flex; gap: 6px; align-items: baseline; padding: 6px 10px; border-radius: 8px; background: #e7eee7; }
      .input b { font-weight: 650; }
      .input code { color: #42534a; font-size: 12px; }
      details { border-top: 1px solid #d9e1d9; margin-top: 22px; padding-top: 12px; }
      summary { color: #385342; cursor: pointer; font-weight: 650; }
      pre { max-height: 360px; overflow: auto; white-space: pre; padding: 14px; border-radius: 8px; color: #e4eee6; background: #19251f; font: 12px/1.5 ui-monospace, SFMono-Regular, monospace; }
      .error { padding: 16px; border: 1px solid #edc3bc; border-radius: 10px; color: #812c20; background: #fff0ed; }
      .cso-document { padding: 18px; border: 1px solid #d9e1d9; border-radius: 12px; background: white; }
      @media (max-width: 600px) { body { padding: 16px; } .cso-document { padding: 12px; } }
    </style>
  </head>
  <body>
    <div id="root"><p role="status">Loading calculation report…</p></div>
    <script>
      window.addEventListener("error", (event) => {
        const root = document.getElementById("root");
        if (root && !root.querySelector("main, [role='alert']")) {
          const message = document.createElement("p");
          message.setAttribute("role", "alert");
          message.textContent = `The calculation report could not start: ${event.message || "Unknown script error"}`;
          root.replaceChildren(message);
        }
      });
    </script>
    <!-- REPORT_BUNDLE -->
  </body>
</html>
