[project]
name = "agent-hub-api"
version = "0.0.0"
description = "Agent Hub Python application shell"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ag-ui-langgraph==0.0.45",
    "alembic==1.20.0",
    "deepagents==0.7.13",
    "fastapi==0.141.1",
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub_api"]
