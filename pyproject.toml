[project]
name = "agent-hub-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "datamodel-code-generator==0.80.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
line-length = 100
src = ["apps/api/src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agent_hub_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["apps/api/tests", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ag_ui_langgraph.*", "langgraph.checkpoint.postgres.*", "psycopg.*"]
ignore_missing_imports = true
