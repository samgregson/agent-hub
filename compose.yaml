services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: agent_hub
      POSTGRES_PASSWORD: agent_hub
      POSTGRES_USER: agent_hub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_hub -d agent_hub"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - agent-hub-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      AGENT_HUB_DATABASE_URL: postgresql://agent_hub:agent_hub@postgres:5432/agent_hub
      AGENT_HUB_ENVIRONMENT: development
      AGENT_HUB_FIXED_IDENTITY_SUBJECT: local-user
      AGENT_HUB_IDENTITY_MODE: fixed
      AGENT_HUB_OPENAI_API_KEY: ${AGENT_HUB_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      AGENT_HUB_OPENAI_MODEL: ${AGENT_HUB_OPENAI_MODEL:-gpt-5.1}
      AGENT_HUB_FUNCTION_RUNNER_URL: http://python-runner:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
    networks:
      - default
      - python_internal

  python-runner:
    build:
      context: .
      dockerfile: apps/python-runner/Dockerfile
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      # The trusted Deno child has a package-source allowlist. The parent API
      # remains on the isolated network; Python code itself gets no network.
      - default
      - python_internal

  foundation-fixture:
    build:
      context: ./plugins/test-fixture
      dockerfile: Dockerfile
    ports:
      # The API owns localhost:8000. Expose this independently deployed MCP
      # server on a distinct host port for generic MCP-client testing.
      - "8001:8000"

  reference-calculation:
    build:
      context: ./plugins/reference-calculation
      dockerfile: Dockerfile
    ports:
      - "8002:8000"

  calculation-source-object:
    build:
      context: ./plugins/calculation-source-object
      dockerfile: Dockerfile
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - python_internal
    ports:
      - "8003:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      AGENT_HUB_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  agent-hub-postgres:

networks:
  python_internal:
    internal: true
